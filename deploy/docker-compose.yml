services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd}
      POSTGRES_DB: ${POSTGRES_DB:-dishcision}
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    profiles:
      - prod
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dishcision_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:P@ssw0rd@db:5432/dishcision}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}

  frontend:
    profiles:
      - prod
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dishcision_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID}
      NEXT_PUBLIC_ENABLE_BETA_SURVEY: ${NEXT_PUBLIC_ENABLE_BETA_SURVEY}

  tunnel:
    profiles:
      - prod
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: